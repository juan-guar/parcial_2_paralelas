apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: parcial2-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-tasks
  template:
    metadata:
      labels:
        app: api-tasks
    spec:
      containers:
        - name: api
          image: tasks-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # DNS interno según la especificación del parcial
            - name: DB_HOST
              value: "postgres-svc.parcial2-app.svc.cluster.local"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
# 6. BALANCEADOR DE CARGA PARA LA API
apiVersion: v1
kind: Service
metadata:
  name: api-loadbalancer
  namespace: parcial2-app
spec:
  selector:
    app: api-tasks
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: LoadBalancer
